---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: server-certificate
spec:
  isCA: true
  commonName: mycluster-proxy.kafka
  secretName: kroxy-server-key-material
  privateKey:
    algorithm: RSA
    size: 4096
    # Note the cert-manager default is PKCS1. The tls.key generated won't work with Kroxylicious unless you put
    # Bouncy Castle in the classpath.  PKCS8 works without the classpath addition.
    encoding: PKCS8
  keystores:
   pkcs12:
     create: true
     passwordSecretRef:
       name: kroxy-server-keystore-password
       key: storePassword
  dnsNames:
    - proxy-bootstrap-kafka-proxy.apps.rosa.objui-bb3ke-9ks.d41a.p3.openshiftapps.com
    - proxy-broker-0-kafka-proxy.apps.rosa.objui-bb3ke-9ks.d41a.p3.openshiftapps.com
    - proxy-broker-1-kafka-proxy.apps.rosa.objui-bb3ke-9ks.d41a.p3.openshiftapps.com
  usages:
    - server auth
  issuerRef:
    name: selfsigned-issuer
    kind: Issuer
    group: cert-manager.io
